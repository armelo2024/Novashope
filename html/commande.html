<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vente-ligne</title>
    <link rel="stylesheet" href="../css/beauty.css">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- nouveau link de icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Finaliser votre commande
        </h2>

        <form class="formCommande">

            <div class="mb-3">

                <label class="form-label">
            Nom complet
        </label>

                <input type="text" name="nom" class="form-control" id="nom">


            </div>

            <div class="mb-3">

                <label class="form-label">
            Téléphone
        </label>

                <input type="tel" name="telephone" class="form-control" id="telephone">

            </div>

            <div class="mb-3">

                <label class="form-label">
            Email
        </label>

                <input type="email" name="email" class="form-control" id="email">

            </div>

            <div class="mb-3">

                <label class="form-label">
            Ville
        </label>

                <input type="text" name="ville" class="form-control" id="ville">

            </div>

            <div class="mb-3">

                <label class="form-label">
            Adresse de livraison
        </label>

                <textarea class="form-control" name="adresse" id="adresse" rows="3"></textarea>

            </div>

            <button type="submit" name="submit" id="submit" class="btn btn-success w-100">Valider la commande</button>

            <p class="formeMessage"></p>

        </form>
        <!-- Formulaire ici -->
    </div>

    <div id="panierContainer">

    </div>


    <h2 id="total">

    </h2>





    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../js/commande.js"></script>
    <script src="../js/panier.js"></script>

    <!-- js bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
